# =============================================================================
# Market Symphony — Configuration centrale
# -----------------------------------------------------------------------------
# Ce fichier regroupe tous les paramètres *réglables* du projet.
# Les constantes *invariantes* (noms de colonnes, chemins, identifiants de
# régimes...) sont dans backend/app/core/constant.py.
# Toute modification significative doit être tracée dans EVOLUTION.md.
# =============================================================================

project:
  name: "Market Symphony"
  version: "0.3.0"
  description: "Sonification et art génératif des marchés financiers par apprentissage automatique"
  random_seed: 42                    # Reproductibilité (exigence §8)

# -----------------------------------------------------------------------------
# Données (§3)
# -----------------------------------------------------------------------------
data:
  primary_source: "yfinance"         # yfinance | coingecko | alphavantage
  fallback_source: "alphavantage"    # Source de secours (§11)
  interval: "1d"                     # Fréquence journalière uniquement (hors périmètre : temps réel)
  auto_adjust: true                  # Prix ajustés dividendes / splits (adjusted close)
  cache_dir: "data/cache"            # un fichier Parquet par ticker
  cache_ttl_days: 7                  # Au-delà, le cache est rafraîchi (si l'API répond)
  download_retries: 2                # nouvelles tentatives en cas d'échec réseau
  training:
    ticker: "^GSPC"                  # S&P 500
    start: "2000-01-01"              # ≥ 20 ans pour couvrir 2000, 2008, 2020
    end: null                        # null = aujourd'hui

# Actifs proposés dans le sélecteur (F1)
assets:
  - { ticker: "^GSPC",   name: "S&P 500",  type: "index",  source: "yfinance" }
  - { ticker: "^FCHI",   name: "CAC 40",   type: "index",  source: "yfinance" }
  - { ticker: "^DJI",    name: "Dow Jones", type: "index", source: "yfinance" }
  - { ticker: "AAPL",    name: "Apple",    type: "stock",  source: "yfinance" }
  - { ticker: "TSLA",    name: "Tesla",    type: "stock",  source: "yfinance" }
  - { ticker: "BTC-USD", name: "Bitcoin",  type: "crypto", source: "yfinance" }

# Préréglages historiques (F2) — dates incluant une marge de contexte
presets:
  - { id: "dotcom_2000",  name: "Bulle Internet",        ticker: "^GSPC", start: "1999-06-01", end: "2002-12-31" }
  - { id: "subprime_2008", name: "Krach de 2008",        ticker: "^GSPC", start: "2007-06-01", end: "2009-06-30" }
  - { id: "flash_2010",   name: "Flash crash 2010",      ticker: "^GSPC", start: "2010-03-01", end: "2010-07-31" }
  - { id: "covid_2020",   name: "Krach du Covid-19",     ticker: "^GSPC", start: "2019-11-01", end: "2020-09-30" }
  - { id: "bull_2017",    name: "Marché haussier 2017",   ticker: "^GSPC", start: "2017-01-01", end: "2017-12-31" }
  - { id: "btc_2021",     name: "Bitcoin 2021",          ticker: "BTC-USD", start: "2020-10-01", end: "2022-06-30" }

# -----------------------------------------------------------------------------
# Features (§4.1)
# -----------------------------------------------------------------------------
features:
  volatility_window: 20              # jours
  annualization_factor: 252          # √252 appliqué à l'écart-type journalier
  momentum_windows: [20, 60]         # rendements cumulés
  drawdown_window: 252               # « plus haut historique récent » = 1 an glissant
  volume_window: 20                  # moyenne mobile pour le volume relatif
  # Variables utilisées en entrée des modèles (ordre important)
  model_inputs:
    - "log_return"
    - "volatility"
    - "momentum_20"
    - "momentum_60"
    - "drawdown"
    - "relative_volume"

# -----------------------------------------------------------------------------
# Modèles (§4.2 / §4.3)
# -----------------------------------------------------------------------------
models:
  n_regimes: 4
  artifacts_dir: "models"
  kmeans:
    n_init: 20
    max_iter: 500
  hmm:
    covariance_type: "full"          # full | diag | tied | spherical
    n_iter: 1000
    tol: 0.0001
  candidate_states: [2, 3, 4, 5, 6]  # plage testée pour le BIC
  evaluation:
    min_mean_regime_duration: 5       # jours — critère de stabilité
    min_panic_share: 0.8              # part minimale de « panique » sur chaque crise
    panic_checks:                     # cohérence historique attendue
      - { start: "2008-09-15", end: "2008-11-30" }
      - { start: "2020-03-01", end: "2020-03-31" }

# -----------------------------------------------------------------------------
# Sonification & visuel (§5)
# -----------------------------------------------------------------------------
sonification:
  base_midi_note: 60                 # Do central (C4)
  octave_range: 2                    # nombre d'octaves autorisées (évite un son désagréable)
  return_clip: 0.05                  # |rendement| ≥ 5 % → note extrême
  volatility: { min: 0.05, max: 0.80 }   # volatilité annualisée → 0 (calme) … 1 (extrême)
  relative_volume_max: 3.0                # volume 3× la moyenne = intensité maximale
  tempo_bpm:  { min: 70,  max: 160 }
  reverb_wet: { min: 0.1, max: 0.7 }
  velocity:   { min: 0.2, max: 1.0 }

visual:
  target_fps: 60
  particle_size: { min: 4, max: 40 }
  agitation: { min: 0.0, max: 1.0 }
  opacity: { min: 60, max: 255 }

# Lecture (F4)
playback:
  speeds: [1, 2, 4, 8]
  default_speed: 1
  ms_per_day_at_x1: 250              # durée d'une séance à vitesse ×1

# -----------------------------------------------------------------------------
# API (§6.2 / §8)
# -----------------------------------------------------------------------------
api:
  host: "127.0.0.1"
  port: 8010                         # 8000 est souvent pris (Docker/WSL)
  cors_origins:
    - "https://market-symphony.vercel.app"
  cors_origin_regex: '^http://(localhost|127\.0\.0\.1)(:\d+)?$'   # dev : tout port local (guillemets simples : pas d'échappement YAML)
  max_years_per_request: 10
  warmup_days: 400                   # historique chargé avant `start` pour remplir les fenêtres glissantes
  response_time_target_s: 2.0

logging:
  level: "INFO"

# -----------------------------------------------------------------------------
# Réseau / TLS
# -----------------------------------------------------------------------------
network:
  # Ajoute les certificats du magasin Windows au bundle CA (nécessaire si un
  # antivirus type Avast inspecte le HTTPS). auto = activé sous Windows uniquement.
  use_system_certificates: "auto"    # auto | true | false
  ca_bundle_file: "data/cache/ca-bundle.pem"
  request_timeout_s: 30
